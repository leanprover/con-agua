# con-leche's own lakefile sets no leanOptions (so autoImplicit/relaxedAutoImplicit
# are Lean's defaults, both true); override our package-level false so vendored
# files need no edits for this.
leanOptions = {autoImplicit = true, relaxedAutoImplicit = true}

# con-ron's arena checker (B): imports ConLeche's kernel types only, no
# Aeneas/Mathlib. See vendor/README.md for what of ConRon builds and why.
[[lean_lib]]
name = "ConRonArena"
srcDir = "vendor/con-ron"
roots = ["ConRon.Arena"]
leanOptions = {autoImplicit = true, relaxedAutoImplicit = true}

# Theorem 1 (DESIGN.md §8.2): the bridge from the arena twin to con-leche's
# pure checker. Imports ConRonArena + ConLeche only, no Aeneas/Mathlib.
#
# NOT in defaultTargets: it does not build on our current toolchain (the
# Kraken-fork bump to nightly-2026-10-20). Two separate blockers, both
# vendor/README.md "grind regressions", neither Aeneas/Mathlib-related:
#   1. ConRon.Bridge.Inductives.BlockWF (and other modules) need
#      ConLeche.Verify.Cached.{GenRecC,NestPosC,BlockRunC,TargetRecC}, which
#      are excluded from the ConLeche lib above (the KnotC regression).
#   2. ConRon/Bridge/Specs.lean itself has its own `finish` failures
#      (`internLam`/`Ext`-preservation goals) independent of ConLeche, not
#      yet investigated.
# `lake build ConRonBridge` still works as a target to re-check this.
[[lean_lib]]
name = "ConRonBridge"
srcDir = "vendor/con-ron"
roots = ["ConRon.Bridge"]
globs = ["ConRon.Bridge.+"]
leanOptions = {autoImplicit = true, relaxedAutoImplicit = true}
