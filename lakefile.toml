name = "ConAgua"
version = "0.1.0"
defaultTargets = ["ConAgua", "ConLeche", "ConRonArena"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "Kraken"
git = "https://github.com/sgraf812/kraken"
rev = "ba12834902fd19e837c97d0e5ea585d41348ee7e"

[[lean_lib]]
name = "ConAgua"

# Vendored from con-leche (rev 103562b) and con-ron (rev 4c9eaf7, proof/ dir).
# See vendor/README.md for provenance and every patch applied.
#
# NOT globbed: "ConLeche" (bare root), "ConLeche.MainTheorem", "ConLeche.Model.+"
# and "ConLeche.Verify.Cached.+" (~124 modules). These fail on our toolchain's
# `grind` (not on nightly-2026-09-21 — a regression surfaced by the Kraken-fork
# toolchain bump to nightly-2026-10-20): `ConLeche.Verify.Cached.KnotC`'s memo-hit
# lemmas no longer let `grind` split a derived conjunction, and everything that
# transitively imports it (see vendor/README.md) is excluded here. They are
# still vendored (the .lean files are all present), just not in this lib's
# buildable set.
[[lean_lib]]
name = "ConLeche"
srcDir = "vendor/con-leche"
# No implicit default root (which would be "ConLeche", the bare aggregator —
# excluded, see above): roots = [] and an exact (non-"+") glob entry per
# buildable module, generated and verified by a script that computed the
# transitive import closure of the tier roots below and checked it has zero
