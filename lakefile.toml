name = "ConAgua"
version = "0.1.0"
defaultTargets = ["ConAgua", "ConLeche", "ConRonArena", "ConRonBridge"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "Kraken"
git = "https://github.com/sgraf812/kraken"
rev = "ba12834902fd19e837c97d0e5ea585d41348ee7e"

[[lean_lib]]
name = "ConAgua"
# `ConAgua.Arena.Refine` imports con-ron's arena (not `module` files), so the `module` root
# `ConAgua` cannot import it; it is built through the glob (the root is listed too, see
# vendor/README.md, "Lake quirk"). `ConAgua.Capstone` imports `ConAgua.Arena.LitRefine`, so it is
# a plain (non-`module`) file too, and built the same way.
globs = ["ConAgua", "ConAgua.Arena.Refine", "ConAgua.Arena.StoreRel", "ConAgua.Arena.StoreLib", "ConAgua.Arena.LitRefine",
  "ConAgua.Arena.AppStore", "ConAgua.Arena.AppRefine",
  "ConAgua.Arena.LevelStore", "ConAgua.Arena.LevelRefine",
  "ConAgua.Arena.ZeroStore", "ConAgua.Arena.ZeroRefine",
  "ConAgua.Arena.MaxStore", "ConAgua.Arena.MaxRefine",
  "ConAgua.Arena.ImaxStore", "ConAgua.Arena.ImaxRefine",
  "ConAgua.Arena.ParamStore", "ConAgua.Arena.ParamRefine",
  "ConAgua.Arena.SortStore", "ConAgua.Arena.SortRefine",
  "ConAgua.Arena.ConstStore", "ConAgua.Arena.ConstRefine",
  "ConAgua.Arena.LetStore", "ConAgua.Arena.LetRefine",
  "ConAgua.Arena.LamStore", "ConAgua.Arena.LamRefine",
  "ConAgua.Arena.ForallStore", "ConAgua.Arena.ForallRefine",
  "ConAgua.Arena.BVarStore", "ConAgua.Arena.BVarRefine", "ConAgua.Arena.MemoLib", "ConAgua.Arena.ViewL", "ConAgua.Arena.ExprMk", "ConAgua.Arena.DerRel", "ConAgua.Arena.View", "ConAgua.Arena.MemoLibRel",
  "ConAgua.Arena.LsStore", "ConAgua.Arena.LsRefine", "ConAgua.Arena.PoolSlice",
  "ConAgua.Arena.NStrStore", "ConAgua.Arena.NStrRefine",
  "ConAgua.Arena.NAnonStore", "ConAgua.Arena.NAnonRefine",
  "ConAgua.Arena.NNumStore", "ConAgua.Arena.NNumRefine",
  "ConAgua.Arena.FVarStore", "ConAgua.Arena.FVarRefine",
  "ConAgua.Arena.ProjStore", "ConAgua.Arena.ProjRefine",
  "ConAgua.Arena.Frame", "ConAgua.Arena.ArenaRel",
  "ConAgua.Arena.Walk", "ConAgua.Arena.WalkRefine", "ConAgua.Arena.WalkBench", "ConAgua.Arena.WalkEmit",
  "ConAgua.Arena.WalkBenchLean",
  "ConAgua.Capstone",
  "ConAgua.Final.Twin", "ConAgua.Final.Statement",
  "ConAgua.Front.Fields", "ConAgua.Front.FieldsLink",
  "ConAgua.Front.Apply", "ConAgua.Front.StateDR", "ConAgua.Front.Line", "ConAgua.Front.LineRefine",
  "ConAgua.Front.ExprIface", "ConAgua.Front.Preserve", "ConAgua.Front.Driver", "ConAgua.Front.DriverRefine", "ConAgua.Front.DeclIface", "ConAgua.Front.NatDec", "ConAgua.Front.NatDecLink"]

# Vendored from con-leche (rev 103562b) and con-ron (rev 4c9eaf7, proof/ dir).
# See vendor/README.md for provenance and every patch applied.
[[lean_lib]]
name = "ConLeche"
srcDir = "vendor/con-leche"
# Everything under ConLeche/ (incl. the bare aggregator and MainTheorem). The
# root is listed in `globs` verbatim too: with a bare-file root plus a `+`
# glob, Lake can fail to schedule the root (vendor/README.md, "Lake quirk").
roots = ["ConLeche"]
globs = ["ConLeche", "ConLeche.+"]
# con-leche's own lakefile sets no leanOptions (so autoImplicit/relaxedAutoImplicit
# are Lean's defaults, both true); override our package-level false so vendored
# files need no edits for this.
leanOptions = {autoImplicit = true, relaxedAutoImplicit = true}

# con-ron's arena checker (B): imports ConLeche's kernel types only, no
# Aeneas/Mathlib. See vendor/README.md for what of ConRon builds and why.
[[lean_lib]]
name = "ConRonArena"
srcDir = "vendor/con-ron"
roots = ["ConRon.Arena"]
leanOptions = {autoImplicit = true, relaxedAutoImplicit = true}

# Theorem 1 (DESIGN.md §8.2): the bridge from the arena twin to con-leche's
# pure checker. Imports ConRonArena + ConLeche only, no Aeneas/Mathlib. Its
# eighty-odd modules are siblings, not all reachable from the root, hence the
# glob (as in con-ron's own lakefile).
[[lean_lib]]
name = "ConRonBridge"
srcDir = "vendor/con-ron"
roots = ["ConRon.Bridge"]
globs = ["ConRon.Bridge.+"]
leanOptions = {autoImplicit = true, relaxedAutoImplicit = true}

# Baseline for the compiled-L measurement (DESIGN.md, "The compiler"): con-leche's compiled
# `skipBraced` over a lean4export file.
[[lean_exe]]
name = "skipbench"
root = "ConAgua.Compiler.Bench"

# Baseline for the compiled walk (DESIGN.md, lane `walk`): con-ron's compiled arena
# `bvarBoundMemo` on a deep term.
[[lean_exe]]
name = "walkbench"
root = "ConAgua.Arena.WalkBenchLean"

# Baseline for the Stage B validator (DESIGN.md, "Stage B"): con-leche's compiled `scanLineFwd`
# over a lean4export file, with the validator's driver.
[[lean_exe]]
name = "valbench"
root = "ConAgua.Scan.Bench"
