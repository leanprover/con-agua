# The committed assembler file of the checker (lane asmfile): `ConAguaAsm.Checker` reads it at
# elaboration time (`include_asm`), so its library `needs` it: the file's content hash is part of
# the input hash of every module of `ConAguaAsm` (rebuilds, and the shared artifact cache's key).
# Only the modules that read the file belong to this library (a `needs` invalidates the whole
# library when the file changes).
[[input_file]]
name = "checker_s"
path = "checker.s"
text = true

[[lean_lib]]
name = "ConAguaAsm"
roots = []
globs = ["ConAguaAsm.+"]
needs = ["checker_s"]

# Vendored from con-leche and con-ron (proof/ dir) at the revisions in vendor/UPSTREAM, plus the
# patch series vendor/patches/ (scripts/bump-con-ron.sh; vendor/README.md).
[[lean_lib]]
name = "ConLeche"
srcDir = "vendor/con-leche"
# Everything under ConLeche/ (incl. the bare aggregator and MainTheorem). The
# root is listed in `globs` verbatim too: with a bare-file root plus a `+`
# glob, Lake can fail to schedule the root (vendor/README.md, "Lake quirk").
roots = ["ConLeche"]
globs = ["ConLeche", "ConLeche.+"]
# con-leche's own lakefile sets no leanOptions (so autoImplicit/relaxedAutoImplicit
# are Lean's defaults, both true); override our package-level false so vendored
# files need no edits for this.
leanOptions = {autoImplicit = true, relaxedAutoImplicit = true}

# con-ron's arena checker (B): imports ConLeche's kernel types only, no
# Aeneas/Mathlib. See vendor/README.md for what of ConRon builds and why.
[[lean_lib]]
name = "ConRonArena"
srcDir = "vendor/con-ron"
roots = ["ConRon.Arena", "ConRon.Dump.Pins"]
leanOptions = {autoImplicit = true, relaxedAutoImplicit = true}

# Theorem 1 (DESIGN.md §8.2): the bridge from the arena twin to con-leche's
# pure checker. Imports ConRonArena + ConLeche only, no Aeneas/Mathlib. Its
# eighty-odd modules are siblings, not all reachable from the root, hence the
# glob (as in con-ron's own lakefile).
[[lean_lib]]
name = "ConRonBridge"
srcDir = "vendor/con-ron"
roots = ["ConRon.Bridge"]
globs = ["ConRon.Bridge.+"]
leanOptions = {autoImplicit = true, relaxedAutoImplicit = true}

# Baseline for the compiled-L measurement (DESIGN.md, "The compiler"): con-leche's compiled
# `skipBraced` over a lean4export file.
[[lean_exe]]
name = "skipbench"
root = "ConAgua.Compiler.Bench"

# Baseline for the compiled walk (DESIGN.md, lane `walk`): con-ron's compiled arena
# `bvarBoundMemo` on a deep term.
[[lean_exe]]
name = "walkbench"
root = "ConAgua.Arena.WalkBenchLean"

# Baseline for the compiled lift benchmark (DESIGN.md, lane `exprops2`): con-ron's compiled arena
# `liftLooseBVarsFast` on a deep term.
[[lean_exe]]
name = "liftbenchlean"
root = "ConAgua.Arena.LiftBenchLean"

# Baseline for the compiled instantiate1 benchmark (DESIGN.md, lane `exprops2`): con-ron's
# compiled arena `instantiate1Fast` on a deep term.
[[lean_exe]]
name = "instbenchlean"
root = "ConAgua.Arena.Inst1BenchLean"

# Baseline for the Stage B validator (DESIGN.md, "Stage B"): con-leche's compiled `scanLineFwd`
# over a lean4export file, with the validator's driver.
[[lean_exe]]
name = "valbench"
root = "ConAgua.Scan.Bench"

# The progress census (scripts/census.py, PLAN.md "Progress census"): dumps the twin targets
# reached from `TwinAccepts` and the `@[l_impl]`/`@[refines]` links with their axioms.
[[lean_exe]]
name = "census"
root = "ConAgua.Census.Main"
supportInterpreter = true

# The e2e lane's reference (DESIGN.md, lane `e2e`): con-ron's arena checker (the twin) compiled by
# Lean, `con-ron-lean FILE [--no-pins]` (exit 0 accept, 1 reject, 2 decline, 3 error).
[[lean_exe]]
name = "con-ron-lean"
srcDir = "vendor/con-ron"
root = "ConRon.Arena.Exe"

# The e2e lane's reference at the program's own pin list, optionally without the prelude
# (`ConAgua/E2E/Ref.lean`).
[[lean_exe]]
name = "e2e-ref"
root = "ConAgua.E2E.Ref"

# The e2e lane's runner: compile (`asm`) or interpret (`run`) an assembled program file
# (`ConAgua/E2E/Main.lean`, `scripts/e2e.py`).
[[lean_exe]]
name = "e2e-l"
root = "ConAgua.E2E.Main"

# Lane `romload`: the pin-data buffer generator (`ConAgua/Rom/Gen.lean`), `romgen OUT`.
[[lean_exe]]
name = "romgen"
root = "ConAgua.Rom.Gen"

# The e2e lane's per-function differential tests against the twin (`ConAgua/E2E/Diff.lean`).
[[lean_exe]]
name = "e2e-diff"
root = "ConAgua.E2E.Diff"

# Lane `romload`: the L pin stages against the twin's on a pin-data buffer (`ConAgua/Rom/Test.lean`).
[[lean_exe]]
name = "romtest"
root = "ConAgua.Rom.Test"

# Lane `compopt`: `e2e-l asm` without the compiler proof's imports (`ConAgua/E2E/AsmOpt.lean`).
[[lean_exe]]
name = "compopt-asm"
root = "ConAgua.E2E.AsmOpt"
